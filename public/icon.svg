<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171F" />
      <stop offset="100%" stop-color="#0B0C10" />
    </linearGradient>
    <linearGradient id="nib" x1="20%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="55%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="curve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Subtle Geometric Grid Accent -->
  <path d="M96 176 H416 M96 336 H416 M176 96 V416 M336 96 V416" stroke="rgba(255,255,255,0.04)" stroke-width="2" />

  <!-- Sweeping Bezier Curve -->
  <path d="M108 356 C168 156, 344 356, 404 156" fill="none" stroke="url(#curve)" stroke-width="18" stroke-linecap="round" />

  <!-- Bezier Tangent Handle Line -->
  <line x1="146" y1="176" x2="366" y2="176" stroke="#93C5FD" stroke-width="6" stroke-dasharray="10 10" stroke-linecap="round" opacity="0.75" />

  <!-- Stylized Vector Pen Nib / V Monogram -->
  <path d="M256 108 L348 258 L302 368 L210 368 L164 258 Z" fill="url(#nib)" />
  <path d="M256 108 L256 244" stroke="#0F172A" stroke-width="10" stroke-linecap="round" />
  <circle cx="256" cy="256" r="18" fill="#0F172A" />

  <!-- Nib Base Collar -->
  <rect x="200" y="368" width="112" height="28" rx="10" fill="#E2E8F0" />

  <!-- Anchor Handle Nodes -->
  <circle cx="146" cy="176" r="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="6" />
  <circle cx="366" cy="176" r="14" fill="#FFFFFF" stroke="#3B82F6" stroke-width="6" />
  <rect x="94" y="342" width="28" height="28" rx="6" fill="#38BDF8" stroke="#FFFFFF" stroke-width="5" />
  <rect x="390" y="142" width="28" height="28" rx="6" fill="#818CF8" stroke="#FFFFFF" stroke-width="5" />
</svg>
